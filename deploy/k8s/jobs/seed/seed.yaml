# One-off job that loads the synthetic data. Not part of the normal deployment; the script
# "dealcopilot seed" deletes the old run and applies this file again.
apiVersion: batch/v1
kind: Job
metadata:
  name: seed
  labels: {app.kubernetes.io/component: seed}
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels: {app.kubernetes.io/component: seed}
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      initContainers:
        - name: wait-for-neo4j
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z neo4j 7687; do echo waiting for neo4j; sleep 3; done"]
      containers:
        - name: seed
          image: dealcopilot-api:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.seed"]
          envFrom:
            - configMapRef: {name: dealcopilot-config}
          env:
            - name: NEO4J_PASSWORD
              valueFrom:
                secretKeyRef: {name: dealcopilot-secrets, key: NEO4J_PASSWORD}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: {name: dealcopilot-secrets, key: JWT_SECRET}
            - name: DEMO_USER_PASSWORD
              valueFrom:
                secretKeyRef: {name: dealcopilot-secrets, key: DEMO_USER_PASSWORD, optional: true}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 768Mi}
