# Keeps at least one copy of the API and the web app running while nodes are drained for upgrades.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api
spec:
  minAvailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: api}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: frontend
spec:
  minAvailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: frontend}
