# Optional: run Ollama inside the cluster. Skip this component if you point OLLAMA_BASE_URL at an
# Ollama running elsewhere. CPU-only by default; for a GPU node pool add
#   resources.limits."nvidia.com/gpu": 1
# to the container (needs the NVIDIA device plugin) and a matching nodeSelector or toleration.
apiVersion: v1
kind: Service
metadata:
  name: ollama
  labels: {app.kubernetes.io/name: ollama}
spec:
  selector: {app.kubernetes.io/name: ollama}
  ports:
    - {name: http, port: 11434, targetPort: http}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-models
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 20Gi} # the two models together are about 5 GB
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  labels: {app.kubernetes.io/name: ollama}
spec:
  replicas: 1
  strategy: {type: Recreate} # the model disk can be attached to one pod at a time
  selector:
    matchLabels: {app.kubernetes.io/name: ollama}
  template:
    metadata:
      labels: {app.kubernetes.io/name: ollama}
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:latest
          ports:
            - {name: http, containerPort: 11434}
          env:
            - {name: OLLAMA_KEEP_ALIVE, value: 30m}
          resources:
            requests: {cpu: "2", memory: 8Gi}
            limits: {memory: 12Gi}
          volumeMounts:
            - {name: models, mountPath: /root/.ollama}
          readinessProbe:
            httpGet: {path: /api/tags, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /api/tags, port: http}
            periodSeconds: 30
            failureThreshold: 6
      volumes:
        - name: models
          persistentVolumeClaim: {claimName: ollama-models}
---
# Downloads the two models into the disk once. Safe to run again: models already present are skipped.
apiVersion: batch/v1
kind: Job
metadata:
  name: ollama-pull-models
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: pull
          image: ollama/ollama:latest
          env:
            - {name: OLLAMA_HOST, value: "http://ollama:11434"}
          command:
            - sh
            - -c
            - |
              until ollama list >/dev/null 2>&1; do echo "waiting for ollama"; sleep 5; done
              ollama pull qwen2.5:7b-instruct
              ollama pull nomic-embed-text
          resources:
            requests: {cpu: 100m, memory: 128Mi}
