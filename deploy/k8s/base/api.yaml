# The FastAPI backend. Stateless (sign-in uses signed tokens), so it can run several copies.
apiVersion: v1
kind: Service
metadata:
  name: api
  labels: {app.kubernetes.io/name: api}
spec:
  selector: {app.kubernetes.io/name: api}
  ports:
    - {name: http, port: 8000, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels: {app.kubernetes.io/name: api}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: api}
  template:
    metadata:
      labels: {app.kubernetes.io/name: api}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001 # the "appuser" created in backend/Dockerfile
        runAsGroup: 10001
      initContainers:
        # Wait until the database accepts connections, so the API does not start against nothing.
        - name: wait-for-neo4j
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z neo4j 7687; do echo waiting for neo4j; sleep 3; done"]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 32Mi}
      containers:
        - name: api
          # Replaced with the registry name and tag by deploy/scripts (kustomize "images").
          image: dealcopilot-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8000}
          envFrom:
            - configMapRef: {name: dealcopilot-config}
          env:
            - name: NEO4J_PASSWORD
              valueFrom:
                secretKeyRef: {name: dealcopilot-secrets, key: NEO4J_PASSWORD}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: {name: dealcopilot-secrets, key: JWT_SECRET}
            - name: DEMO_USER_PASSWORD
              valueFrom:
                secretKeyRef: {name: dealcopilot-secrets, key: DEMO_USER_PASSWORD, optional: true}
          resources:
            requests: {cpu: 200m, memory: 384Mi}
            limits: {memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          startupProbe:
            httpGet: {path: /api/v1/health/live, port: http}
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /api/v1/health/live, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /api/v1/health/live, port: http}
            periodSeconds: 20
            failureThreshold: 3
