name: Publish images

# Builds the two Docker images and pushes them to the GitHub container registry (ghcr.io).
# Runs when you push a version tag (git tag v1.0.0 && git push --tags) or start it by hand.
# Other registries (ACR, ECR, Artifact Registry): change "registry" and the login step.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  registry: ghcr.io/${{ github.repository_owner }}

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {name: dealcopilot-api, context: backend}
          - {name: dealcopilot-frontend, context: frontend}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Tags: the git tag (v1.0.0) when run from a tag, otherwise the short commit id.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.registry }}/${{ matrix.name }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
