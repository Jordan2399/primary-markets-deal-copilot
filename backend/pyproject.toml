[project]
name = "deal-copilot-api"
version = "0.1.0"
description = "Primary Markets Deal Copilot: FastAPI backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "neo4j>=5.24,<6.0",
  "httpx>=0.27",
  "structlog>=24.4",
  "langgraph>=0.2,<2",
  "python-multipart>=0.0.9",
  "pdfplumber>=0.11",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=1.0",
  "httpx2>=2.16",
  "ruff>=0.6",
  "reportlab>=4.0",
  "mypy>=1.11",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: needs a real Neo4j (set TEST_NEO4J_URI, TEST_NEO4J_PASSWORD)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# Long lines are Cypher queries and prompts, which read better unbroken. The formatter wraps code.
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
