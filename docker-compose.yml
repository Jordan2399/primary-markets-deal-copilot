# Base stack shared by development and production.
# Do not run this file alone; use the dev or prod override (see README).
# Ollama is NOT part of this stack: it runs natively on the host to use the GPU.

name: ${COMPOSE_PROJECT_NAME:-dealcopilot}

x-api-env: &api-env
  APP_ENV: ${APP_ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  NEO4J_URI: bolt://neo4j:7687
  NEO4J_USER: neo4j
  NEO4J_PASSWORD: ${NEO4J_PASSWORD}
  LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
  LLM_CHAT_MODEL: ${LLM_CHAT_MODEL:-qwen2.5:7b-instruct}
  LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-300}
  TERMSHEET_MODEL_MODE: ${TERMSHEET_MODEL_MODE:-gaps}
  LLM_EMBED_MODEL: ${LLM_EMBED_MODEL:-nomic-embed-text}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
  AUTH_MODE: ${AUTH_MODE:-jwt}
  JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-dev-only-secret-0000}
  JWT_TTL_MINUTES: ${JWT_TTL_MINUTES:-480}
  DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-}

services:
  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in your env file}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1g
    volumes:
      - neo4j_data:/data
    healthcheck:
      # NEO4J_AUTH is "neo4j/<password>"; do not add a NEO4J_PASSWORD var (the image treats it as a config setting and crashes).
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#neo4j/}\" 'RETURN 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 30s

  api:
    build: ./backend
    environment: *api-env
    extra_hosts:
      # Makes host.docker.internal work on Linux too (Docker Desktop on Windows has it already).
      - "host.docker.internal:host-gateway"
    depends_on:
      neo4j:
        condition: service_healthy

  # One-off data loader: run with --profile tools (see README). Refuses to run when APP_ENV=production.
  seed:
    extends:
      service: api
    profiles: ["tools"]
    command: ["python", "-m", "app.seed"]
    healthcheck:
      disable: true
    depends_on:
      neo4j:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      API_INTERNAL_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy

volumes:
  neo4j_data:
